seed: 0

# Subsample sizes per benchmark (report exact ids in results).
harmful:
  advbench: 200
  harmbench: 100
  jailbreakbench: 100
benign_n: 50           # matched benign_forced control (small/fast, per UncertaiNLP scope)
benign_source: alpaca  # alpaca (plain-benign, PREFERRED for the A1 control) | xstest (over-refusal robustness)

grammar:
  name: forced_steps   # forced_steps (refusal-masking, query-in-prompt) | multi_step | affirmative_prefix
  n_steps: 5
  min_step_chars: 60   # forced_steps only: forbids closing a step empty
  opener: "Sure, here are the detailed steps: "

max_new_tokens: 24     # you only measure the early forced positions; 24 covers the depth cut
refusal_set: large     # small | large  (flip for the R-sensitivity ablation)

# Sequence-level refusal score S_R (multi-token refusal prefixes, teacher-forced).
# Computed every `stride` positions (1 = every token; higher = cheaper).
refusal_score:
  stride: 2            # dense enough for a clean S_R-vs-position figure at T=24

# Restoration sweep (E5): positions at which R u {EOS} is re-allowed.
restoration_positions: [0, 2, 4, 8, 16, 32]
